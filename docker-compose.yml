services:
  db:
    image: postgres:16-alpine
    container_name: rehab-postgres
    environment:
      POSTGRES_DB: rehabilitation_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rehabilitation_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rehab-app
    stdin_open: true
    tty: true
    environment:
      REHAB_DB_URL: jdbc:postgresql://db:5432/rehabilitation_center
      REHAB_DB_USER: postgres
      REHAB_DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
